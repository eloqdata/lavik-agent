services:
  lavik:
    build: .
    image: lavik-local:0.1.0-beta.1
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:9100:9100"
    volumes:
      - lavik-data:/var/lib/lavik
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    ulimits:
      memlock:
        soft: 536870912
        hard: 536870912
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli --raw PING)\" = PONG"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
volumes:
  lavik-data:
