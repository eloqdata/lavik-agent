name: Write and publish a bilingual campaign
on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: Unique lowercase slug (letters, digits, hyphens)
        required: true
      brief:
        description: Audience, topic, desired outcome and evidence to discuss
        required: true
permissions:
  contents: write
jobs:
  campaign:
    # Only trusted main-branch code receives model and repository credentials.
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: lavik-production-publication
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo sysctl -w kernel.io_uring_disabled=0
      - run: npm run verify:prepare
      - run: npm run verify:examples
      - name: Write, execute, independently review, revise, and publish
        run: npm run agent:write -- "$CAMPAIGN_ID" "$CAMPAIGN_BRIEF"
        env:
          CAMPAIGN_ID: ${{ inputs.campaign_id }}
          CAMPAIGN_BRIEF: ${{ inputs.brief }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          LAVIK_WRITER_MODEL: ${{ vars.LAVIK_WRITER_MODEL }}
          LAVIK_REVIEWER_MODEL: ${{ vars.LAVIK_REVIEWER_MODEL }}
          LAVIK_WRITER_REASONING_EFFORT: ${{ vars.LAVIK_WRITER_REASONING_EFFORT }}
          LAVIK_REVIEWER_REASONING_EFFORT: ${{ vars.LAVIK_REVIEWER_REASONING_EFFORT }}
          LAVIK_WRITER_MAX_TOKENS: ${{ vars.LAVIK_WRITER_MAX_TOKENS }}
          LAVIK_REVIEWER_MAX_TOKENS: ${{ vars.LAVIK_REVIEWER_MAX_TOKENS }}
          LAVIK_AGENT_TIMEOUT_MS: ${{ vars.LAVIK_AGENT_TIMEOUT_MS }}
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Commit validated content
        run: |
          git config user.name 'lavik-agent[bot]'
          git config user.email 'lavik-agent[bot]@users.noreply.github.com'
          git add content/en content/zh-CN evidence/reviews evidence/verification evidence/runs
          git diff --cached --quiet || git commit -m 'Publish verified bilingual campaign'
          git push origin HEAD:main
      # GITHUB_TOKEN pushes do not trigger another push workflow; deploy here.
      - if: vars.LAVIK_AUTO_DEPLOY == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_LAVIK }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: campaign-evidence
          path: .runs
          include-hidden-files: true
          retention-days: 30
