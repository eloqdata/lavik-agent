name: Verify stable release artifacts
on:
  workflow_dispatch:
  push:
    branches: [release/0.1.0-packages]
    paths:
      - packaging/**
      - packages/apt/**
      - scripts/build-apt.sh
      - scripts/stage-apt.ts
      - scripts/verify-apt.py
      - .github/workflows/release-artifacts.yml
permissions:
  contents: read
jobs:
  published:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      SINGLE: eloqdata/lavik@sha256:b9e84e08de65f7a73543ead849ada46e8f2d3860075d71c614a49bc3e51967ba
      CLUSTER: eloqdata/lavik@sha256:f78849ba3ba4253f7cd93567054a138512763a380a35da2de9bc712914ab3cf2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: sudo sysctl -w kernel.io_uring_disabled=0
      - run: docker pull "$SINGLE" && docker pull "$CLUSTER"
      - name: Verify the exact published images on the native architecture
        run: |
          mkdir -p .cache/published-verification
          set -o pipefail
          python3 packaging/docker/0.1.0/smoke-test.py \
            --platform linux/${{ matrix.arch }} --single-image "$SINGLE" --cluster-image "$CLUSTER" \
            --receipt .cache/published-verification/docker-${{ matrix.arch }}.json \
            | tee .cache/published-verification/docker-${{ matrix.arch }}.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: published-verification-${{ matrix.arch }}
          path: .cache/published-verification
          include-hidden-files: true
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo sysctl -w kernel.io_uring_disabled=0
      - run: python3 tests/verify-apt-live.test.py
      - run: node --import tsx scripts/stage-apt.ts .cache/apt-staged
      - name: Verify signed APT installation and persistence
        run: python3 scripts/verify-apt.py .cache/apt-staged .cache/release-verification/apt-${{ matrix.arch }}.json
      - name: Build the pinned standalone image
        run: docker build --target single -t eloqdata/lavik:0.1.0 packaging/docker/0.1.0
      - name: Build the pinned cluster image
        run: docker build --target cluster -t eloqdata/lavik:0.1.0-cluster packaging/docker/0.1.0
      - name: Verify Docker persistence, replication, failover and recovery
        run: |
          set -o pipefail
          python3 packaging/docker/0.1.0/smoke-test.py --platform linux/${{ matrix.arch }} | tee .cache/release-verification/docker-${{ matrix.arch }}.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-verification-${{ matrix.arch }}
          path: .cache/release-verification
          include-hidden-files: true
