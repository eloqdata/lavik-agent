name: Verify content and website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enable io_uring on the disposable runner
        run: sudo sysctl -w kernel.io_uring_disabled=0
      - run: npm run verify:prepare
      # CI validates its own platform without changing reviewed publication receipts.
      - run: npm run verify:examples -- --output-dir .cache/ci-verification
      - run: npm run check
      - name: Verify signed APT installation on native AMD64
        run: python3 scripts/verify-apt.py apps/web/out/apt .cache/ci-verification/apt.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:admin
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-evidence
          path: .cache/ci-verification
          include-hidden-files: true
      - uses: actions/upload-artifact@v6
        with:
          name: website
          path: apps/web/out
          include-hidden-files: true
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.LAVIK_AUTO_DEPLOY == 'true'
    concurrency:
      group: lavik-production-publication
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v6
        with:
          name: website
          path: apps/web/out
      - name: Check that this build still represents main
        id: current
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping a build superseded by newer content.'
          fi
      - if: steps.current.outputs.deploy == 'true'
        run: node --import tsx scripts/notify-indexnow.ts --capture
      - if: steps.current.outputs.deploy == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE_LAVIK }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.current.outputs.deploy == 'true'
        name: Verify the exact live deployment
        run: python3 scripts/verify_site.py
      - if: steps.current.outputs.deploy == 'true'
        name: Notify search engines after verified deployment
        run: node --import tsx scripts/notify-indexnow.ts
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: discovery-notification
          path: |
            .cache/indexnow-result.json
            .cache/live-deployment.json
          include-hidden-files: true
          if-no-files-found: ignore
