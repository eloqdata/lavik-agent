<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"><title>Lavik request and NVMe SSD I/O path</title><desc>RESP clients connect through kernel TCP to coroutine workers. Workers use memory-resident key indexes and asynchronous SPDK queues to reach NVMe storage. Topology consensus and data replication are separate.</desc><rect width="1200" height="650" rx="14" fill="#f0eade"/><g font-family="Arial,sans-serif" fill="#233638"><text x="55" y="57" font-size="31" fill="#233638" font-weight="700">The storage path is an architecture decision</text><text x="55" y="91" font-size="17" fill="#233638" font-weight="400">Lavik 0.1.0 · simplified request path · kernel TCP in the published SPDK experiment</text><rect x="55" y="135" width="300" height="95" rx="10" fill="#fffaf1" stroke="#b7b2a6"/><text x="73" y="170" font-size="21" fill="#233638" font-weight="700">Redis-compatible clients</text><text x="73" y="200" font-size="16" fill="#233638" font-weight="400">RESP2 / RESP3</text><rect x="425" y="135" width="330" height="95" rx="10" fill="#fffaf1" stroke="#b7b2a6"/><text x="443" y="170" font-size="21" fill="#233638" font-weight="700">Bycorf workers</text><text x="443" y="200" font-size="16" fill="#233638" font-weight="400">Pinned logical CPUs · coroutines</text><rect x="825" y="135" width="320" height="95" rx="10" fill="#fffaf1" stroke="#b7b2a6"/><text x="843" y="170" font-size="21" fill="#233638" font-weight="700">In-memory key index</text><text x="843" y="200" font-size="16" fill="#233638" font-weight="400">Owner-local state · routed work</text><path d="M355 181H410M395 171L410 181L395 191M755 181H810M795 171L810 181L795 191M985 230V280H590V325M580 310L590 325L600 310" fill="none" stroke="#a64626" stroke-width="3"/><rect x="425" y="325" width="330" height="95" rx="10" fill="#fffaf1" stroke="#b7b2a6"/><text x="443" y="360" font-size="21" fill="#233638" font-weight="700">Asynchronous storage I/O</text><text x="443" y="390" font-size="16" fill="#233638" font-weight="400">SPDK qpairs + completion polling</text><rect x="55" y="325" width="300" height="95" rx="10" fill="#fffaf1" stroke="#b7b2a6"/><text x="73" y="360" font-size="21" fill="#233638" font-weight="700">Append / grouped storage</text><text x="73" y="390" font-size="16" fill="#233638" font-weight="400">Focused updates · batched replies</text><rect x="825" y="325" width="320" height="95" rx="10" fill="#fffaf1" stroke="#b7b2a6"/><text x="843" y="360" font-size="21" fill="#233638" font-weight="700">NVMe SSD namespaces</text><text x="843" y="390" font-size="16" fill="#233638" font-weight="400">Parallel requests across devices</text><path d="M425 370H370M385 360L370 370L385 380M755 370H810M795 360L810 370L795 380" fill="none" stroke="#a64626" stroke-width="3"/><text x="55" y="490" font-size="19" fill="#233638" font-weight="400">Owner-local state reduces cross-worker coordination on the request path.</text><text x="55" y="528" font-size="19" fill="#233638" font-weight="400">Storage: userspace SPDK NVMe I/O. Networking: Linux TCP in the published experiment.</text><text x="55" y="574" font-size="19" fill="#233638" font-weight="400">Meta: topology and authority via Raft. Data replication: a separate asynchronous protocol.</text></g></svg>