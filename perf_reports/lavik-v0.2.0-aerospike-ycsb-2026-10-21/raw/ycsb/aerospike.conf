# Single-node YCSB device namespace. Performance settings use server defaults.
service {
    cluster-name ycsb-default-20261021
}
logging {
    console {
        context any info
    }
}
network {
    service {
        address 10.96.1.4
        port 3000
    }
    heartbeat {
        address 127.0.0.1
        mode mesh
        port 3002
    }
    fabric {
        address 127.0.0.1
        port 3001
    }
    admin {
        address 127.0.0.1
        port 3003
    }
}
namespace ycsb {
    replication-factor 1
    storage-engine device {
        device /opt/bench020/ycsb/aerospike-device
    }
}
